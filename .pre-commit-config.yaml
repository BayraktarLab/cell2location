repos:
    - repo: https://github.com/psf/black-pre-commit-mirror
      rev: '26.10.1'
      hooks:
          - id: black
    - repo: https://github.com/PyCQA/flake8
      rev: 7.4.1
      hooks:
          - id: flake8
    - repo: https://github.com/pycqa/isort
      rev: 10.0.0b1
      hooks:
          - id: isort
            name: isort (python)
            additional_dependencies: [toml]