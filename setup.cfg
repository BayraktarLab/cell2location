[metadata]
name = cell2location
version = 0.1.5
description = cell2location: High-throughput spatial mapping of cell types
long_description = file: README.md
long_description_content_type = text/markdown
license = Apache License, Version 2.0
url = https://github.com/BayraktarLab/cell2location
author = Vitalii Kleshchevnikov, Artem Shmatko, Emma Dann, Artem Lomakin, Alexander Aivazidis
author_email = vitalii.kleshchevnikov@sanger.ac.uk
keywords =
    spatial-transcriptomics
    spatial-mapping
    spatial-deconvolution
    cell-type-mapping
    cell-type-deconvolution
    visium
    visium-hd
    cytassist
    slide-seq
    stereo-seq
    nanostring-wta
    bayesian
    pyro
    scvi-tools
    scverse
    agent-friendly
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Bio-Informatics
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
    Operating System :: OS Independent


[options]
include_package_data = True
packages = find:
python_requires = >=3.10
install_requires =
    pyro-ppl>=1.8.0
    scvi-tools>=1.3.0
    torch>=1.9.0
    numpy
    pandas
    scanpy
    opencv-python

[options.extras_require]
dev =
    black==22.3
    flake8
    pytest>=5.0
    pytest-cov
    isort
    pre-commit
tutorials =
    leidenalg>=0.8.0
    python-igraph
docs =
    sphinx==3.2.1
    nbsphinx==0.8.7
    sphinx_rtd_theme==0.5.2
    myst-parser==0.15.2
    jinja2<3.1
